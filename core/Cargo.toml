[package]
name = "shutri-core"
version = "0.1.0"
edition = "2021"
description = "Shutri Studio core: episodes, narrative, clips, channels, identity"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
k256 = { version = "0.13", features = ["schnorr", "arithmetic"] }
bech32 = "0.11"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
chacha20poly1305 = "0.10"
scrypt = "0.11"

[dev-dependencies]
tempfile = "3"
